<!doctype html>
<html lang="ja" data-theme="light">
<head>

  <title>pg_quiz - PostgreSQL 14 / OSS-DB クイズ</title>
  <meta name="description" content="PostgreSQL 14 文書に基づく OSS-DB Silver / Gold 対策の選択式クイズ（単一選択・複数選択）。模試・復習・学習分析つき。">

  <script>
    // テーマのちらつき防止（本処理は app.js）
    try {
      var d = JSON.parse(localStorage.getItem('pg_quiz') || '{}');
      if (d.settings && d.settings.theme) document.documentElement.setAttribute('data-theme', d.settings.theme);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/home"><span class="brand-icon">🐘</span>pg_quiz</a>
      <label class="theme-picker">
        <span class="sr-only">テーマ</span>
        <select id="themeSelect" aria-label="テーマ">
          <option value="light">☀ ライト</option>
          <option value="middle">◐ ミドル</option>
          <option value="dark">☾ ダーク</option>
        </select>
      </label>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="メインメニュー">

      <a href="#/history" data-tab="history"><span class="ti">🕘</span><span>履歴</span></a>
      <a href="#/list" data-tab="list"><span class="ti">📚</span><span>問題</span></a>
      <a href="#/refs" data-tab="refs"><span class="ti">🔗</span><span>参考</span></a>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>このアプリを利用するには JavaScript を有効にしてください。</noscript>

  <script src="js/config.js"></script>
